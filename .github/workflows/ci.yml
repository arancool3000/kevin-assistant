name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest pyflakes pyyaml websockets
      - run: python -m pyflakes bob setup-windows tests examples
      - run: python -m pytest -q tests
      - run: bash -n install.sh && shellcheck -S warning install.sh
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r setup-windows/requirements.txt pyinstaller==6.11.1
      - run: pyinstaller --onefile --windowed --uac-admin --name Kevin-Setup --paths setup-windows setup-windows/bob_setup.py
      - name: self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process dist\Kevin-Setup.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content dist\selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
  mac-app:
    needs: test
    strategy:
      matrix:
        include:
          - {os: macos-14, arch: apple-silicon}
          - {os: macos-13, arch: intel}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r setup-windows/requirements.txt pyinstaller==6.11.1
      - run: pyinstaller --windowed --name "Kevin Setup" --osx-bundle-identifier io.github.arancool3000.kevin-setup --paths setup-windows setup-windows/bob_setup.py
      - name: self-test the built app
        run: |
          "dist/Kevin Setup.app/Contents/MacOS/Kevin Setup" --selftest || true
          cat "dist/Kevin Setup.app/Contents/MacOS/selftest.txt"
          grep -q '^ok' "dist/Kevin Setup.app/Contents/MacOS/selftest.txt"
          rm "dist/Kevin Setup.app/Contents/MacOS/selftest.txt"
      - name: zip
        run: |
          cd dist && ditto -c -k --keepParent "Kevin Setup.app" "Kevin-Setup-mac-${{ matrix.arch }}.zip"
          shasum -a 256 "Kevin-Setup-mac-${{ matrix.arch }}.zip" > "Kevin-Setup-mac-${{ matrix.arch }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Kevin-Setup-mac-${{ matrix.arch }}
          path: dist/Kevin-Setup-mac-${{ matrix.arch }}.zip
